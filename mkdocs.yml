site_name: robo-automation
site_url: https://dinilmithra.github.io/robo-automation-docs/
site_description: Generic Playwright and pytest automation framework utilities
copyright: Copyright &copy; 2026 Dinil Mithra

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc

nav:
  - Home: index.md
  - Get Started:
      - Install: getting-started/installation.md
      - Run a Test: getting-started/for-automation-authors.md
  - Use Features:
      - Browser Options: browser-visibility.md
      - Evidence: guides/action-snapshots.md
      - Logs and Performance: guides/performance-correlation.md
  - Troubleshooting: getting-started/error-handling.md
